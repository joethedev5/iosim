name: services-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the services test for x86_64
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CFLAGS="-mios-simulator-version-min=18.0 -isysroot $SDK -O1 -fno-objc-arc -fblocks -Wno-deprecated-declarations"
          xcrun clang -arch x86_64 $CFLAGS tests/services_test.m -o services_test_x86_64 2> out/build-services.err
          file services_test_x86_64
          otool -L services_test_x86_64
          otool -l services_test_x86_64 | grep -A6 LC_MAIN
      - uses: actions/upload-artifact@v4
        with:
          name: services-test
          path: |
            services_test_x86_64
            out/build-services.err
          retention-days: 7
