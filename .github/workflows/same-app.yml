name: same-app
on:
  workflow_dispatch:
    inputs:
      boot_parity:
        description: Run the full boot parity job
        required: false
        default: 'false'
jobs:
  build-binaries:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build every x86_64 fixture
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CFLAGS="-mios-simulator-version-min=18.0 -isysroot $SDK -O1 -fno-objc-arc -fblocks -Wno-deprecated-declarations -I demo"
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/HelloSimApp.m -o HelloSim_x86_64 2> out/build-hello.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/GraphicsApp.m -o GraphicsApp_x86_64 -framework QuartzCore \
            2> out/build-graphics.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/ListApp.m -o ListApp_x86_64 2> out/build-list.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/NavApp.m -o NavApp_x86_64 2> out/build-nav.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/AutoLayoutApp.m -o AutoLayoutApp_x86_64 2>&1 | tee out/build-autolayout.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/TextInputApp.m -o TextInputApp_x86_64 \
            2> out/build-textinput.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/AlertApp.m -o AlertApp_x86_64 2> out/build-alert.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/NumberPadApp.m -o NumberPadApp_x86_64 \
            2> out/build-numberpad.err
          xcrun clang -arch x86_64 $CFLAGS tests/services_test.m \
            -o services_test_x86_64 2> out/build-services.err
          file HelloSim_x86_64 GraphicsApp_x86_64 ListApp_x86_64 NavApp_x86_64 AutoLayoutApp_x86_64 NumberPadApp_x86_64 services_test_x86_64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-binaries
          path: |
            HelloSim_x86_64
            GraphicsApp_x86_64
            ListApp_x86_64
            NavApp_x86_64
            AutoLayoutApp_x86_64
            TextInputApp_x86_64
            AlertApp_x86_64
            NumberPadApp_x86_64
            services_test_x86_64
            out/*.err
          retention-days: 7

  real-apps:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and bundle the arm64 apps
        run: |
          set -e
          mkdir -p out
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          CFLAGS="-mios-simulator-version-min=18.0 -isysroot $SDK -O1 -fno-objc-arc -fblocks -Wno-deprecated-declarations -I demo"
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/HelloSimApp.m -o HelloSim_arm64
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/GraphicsApp.m -o GraphicsApp_arm64 -framework QuartzCore
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/ListApp.m -o ListApp_arm64
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/AutoLayoutApp.m -o AutoLayout_arm64
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/TextInputApp.m -o TextInput_arm64
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/AlertApp.m -o Alert_arm64
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation demo/NumberPadApp.m -o NumberPad_arm64
          mkdir -p HelloSim.app GraphicsApp.app ListApp.app AutoLayout.app TextInput.app Alert.app NumberPad.app
          cp HelloSim_arm64 HelloSim.app/HelloSim
          cp GraphicsApp_arm64 GraphicsApp.app/GraphicsApp
          cp demo/Assets/badge.png GraphicsApp.app/badge.png
          cp ListApp_arm64 ListApp.app/ListApp
          cp AutoLayout_arm64 AutoLayout.app/AutoLayout
          cp TextInput_arm64 TextInput.app/TextInput
          cp Alert_arm64 Alert.app/Alert
          cp NumberPad_arm64 NumberPad.app/NumberPad
          cat > /tmp/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HelloSim</string>
            <key>CFBundleIdentifier</key><string>com.iosim.hellosim</string>
            <key>CFBundleName</key><string>HelloSim</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>18.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIUserInterfaceStyle</key><string>Dark</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key><false/>
              <key>UISceneConfigurations</key>
              <dict>
                <key>UIWindowSceneSessionRoleApplication</key>
                <array>
                  <dict>
                    <key>UISceneConfigurationName</key><string>Default Configuration</string>
                    <key>UISceneDelegateClassName</key><string>SceneDelegate</string>
                  </dict>
                </array>
              </dict>
            </dict>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict></plist>
          PLIST
          cp /tmp/Info.plist HelloSim.app/Info.plist
          sed -e 's/HelloSim/GraphicsApp/g' -e 's/com\.iosim\.hellosim/com.iosim.graphicsapp/g' /tmp/Info.plist > GraphicsApp.app/Info.plist
          sed -e 's/HelloSim/ListApp/g' -e 's/com\.iosim\.hellosim/com.iosim.listapp/g' /tmp/Info.plist > ListApp.app/Info.plist
          sed -e 's/HelloSim/AutoLayout/g' -e 's/com\.iosim\.hellosim/com.iosim.autolayout/g' /tmp/Info.plist > AutoLayout.app/Info.plist
          sed -e 's/HelloSim/TextInput/g' -e 's/com\.iosim\.hellosim/com.iosim.textinput/g' /tmp/Info.plist > TextInput.app/Info.plist
          sed -e 's/HelloSim/Alert/g' -e 's/com\.iosim\.hellosim/com.iosim.alert/g' /tmp/Info.plist > Alert.app/Info.plist
          sed -e 's/HelloSim/NumberPad/g' -e 's/com\.iosim\.hellosim/com.iosim.numberpad/g' /tmp/Info.plist > NumberPad.app/Info.plist
          for app in HelloSim GraphicsApp ListApp AutoLayout TextInput Alert NumberPad; do codesign --force --sign - --timestamp=none "$app.app" || true; done
      - name: Boot and capture each app
        run: |
          set +e
          run_timeout() { python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=float(sys.argv[1])).returncode)' "$@"; }
          xcrun simctl list devices available -j > out/devices.json
          UDID=$(python3 - <<'PY'
          import json
          d = json.load(open('out/devices.json'))['devices']
          best = None
          for rt, devs in d.items():
              if '.iOS-' not in rt:
                  continue
              for dev in devs:
                  if not dev.get('isAvailable', True):
                      continue
                  name = dev['name']
                  if not name.startswith('iPhone'):
                      continue
                  pref = 2 if name == 'iPhone 18 Pro' else (0 if 'Duo' in name else 1)
                  score = (pref, rt)
                  if best is None or score > best[0]:
                      best = (score, dev['udid'], name, rt)
          if best:
              print(best[1])
          PY
          )
          echo "UDID=$UDID"
          [ -z "$UDID" ] && exit 0
          run_timeout 300 xcrun simctl boot "$UDID"
          run_timeout 300 xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --wifiBars 3 --cellularBars 4 --batteryLevel 100 2>/dev/null || true
          # Disable the first-run slide-to-type keyboard tutorial so the software
          # keyboard is visible in the TextInput capture.
          for domain in com.apple.Preferences com.apple.keyboard.preferences; do
            run_timeout 20 xcrun simctl spawn "$UDID" defaults write "$domain" DidShowContinuousPathIntroduction -bool true 2>/dev/null || true
          done
          run_timeout 30 xcrun simctl io "$UDID" screenshot out/springboard-real.png
          for spec in "HelloSim com.iosim.hellosim real-sim" "GraphicsApp com.iosim.graphicsapp graphics-real" "ListApp com.iosim.listapp listapp-real" "AutoLayout com.iosim.autolayout autolayout-real" "TextInput com.iosim.textinput textinput-real" "Alert com.iosim.alert alert-real" "NumberPad com.iosim.numberpad numberpad-real"; do
            set -- $spec
            run_timeout 60 xcrun simctl install "$UDID" "$1.app" || echo "install $1 failed"
            run_timeout 30 xcrun simctl launch "$UDID" "$2" || echo "launch $1 failed"
            if [ "$1" = "TextInput" ] || [ "$1" = "NumberPad" ]; then
              # A second presentation clears the one-shot keyboard tutorial.
              run_timeout 20 xcrun simctl terminate "$UDID" "$2" || true
              run_timeout 20 xcrun simctl launch "$UDID" "$2" || true
            fi
            sleep 6
            run_timeout 30 xcrun simctl io "$UDID" screenshot "out/$3.png" || echo "screenshot $1 failed"
            run_timeout 30 xcrun simctl terminate "$UDID" "$2" || echo "terminate $1 failed"
          done
          sleep 2
          run_timeout 30 xcrun simctl io "$UDID" screenshot out/springboard-real.png || echo "home screenshot failed"
          run_timeout 60 xcrun simctl shutdown "$UDID" || true
          ls -l out/*.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-screens
          path: out/*.png
          retention-days: 7

  build-run:
    if: ${{ github.event.inputs.boot_parity == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build the same source for arm64 and x86_64
        run: |
          set -e
          mkdir -p out artifact
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "$SDK" > out/sdk.txt
          CFLAGS="-mios-simulator-version-min=18.0 -isysroot $SDK -O1 -fno-objc-arc -Wno-deprecated-declarations -I demo"
          xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation \
            demo/HelloSimApp.m -o HelloSim_arm64 2> out/build-arm64.err
          xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
            demo/HelloSimApp.m -o HelloSim_x86_64 2> out/build-x86_64.err
          if ! xcrun clang -arch x86_64 $CFLAGS -fblocks tests/services_test.m \
              -o services_test_x86_64 2> out/build-services.err; then
            echo "services test build failed:"; cat out/build-services.err; exit 1
          fi
          if ! xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation \
              demo/GraphicsApp.m -o GraphicsApp_arm64 \
            -framework QuartzCore 2> out/build-graphics-arm64.err; then
            echo "GraphicsApp arm64 build failed:"; cat out/build-graphics-arm64.err; exit 1
          fi
          if ! xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
              demo/GraphicsApp.m -o GraphicsApp_x86_64 \
            -framework QuartzCore 2> out/build-graphics-x86_64.err; then
            echo "GraphicsApp x86_64 build failed:"; cat out/build-graphics-x86_64.err; exit 1
          fi
          if ! xcrun clang -arch arm64 $CFLAGS -framework UIKit -framework Foundation \
              demo/ListApp.m -o ListApp_arm64 2> out/build-list-arm64.err; then
            echo "ListApp arm64 build failed:"; cat out/build-list-arm64.err; exit 1
          fi
          if ! xcrun clang -arch x86_64 $CFLAGS -framework UIKit -framework Foundation \
              demo/ListApp.m -o ListApp_x86_64 2> out/build-list-x86_64.err; then
            echo "ListApp x86_64 build failed:"; cat out/build-list-x86_64.err; exit 1
          fi
          file HelloSim_arm64 HelloSim_x86_64 services_test_x86_64 > out/file.txt
          otool -L services_test_x86_64 > out/services-libs.txt 2>&1
          for f in HelloSim_arm64 HelloSim_x86_64; do
            echo "===== $f" >> out/otool.txt
            otool -hv "$f" >> out/otool.txt 2>&1
            otool -l "$f" | grep -A5 -E 'LC_BUILD_VERSION' >> out/otool.txt 2>&1
            otool -L "$f" >> out/otool.txt 2>&1
          done
          cat out/file.txt

      - name: Package the arm64 app bundle
        run: |
          set -e
          mkdir -p HelloSim.app
          cp HelloSim_arm64 HelloSim.app/HelloSim
          cat > HelloSim.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HelloSim</string>
            <key>CFBundleIdentifier</key><string>com.iosim.hellosim</string>
            <key>CFBundleName</key><string>HelloSim</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>18.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer></array>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIUserInterfaceStyle</key><string>Dark</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key><false/>
              <key>UISceneConfigurations</key>
              <dict>
                <key>UIWindowSceneSessionRoleApplication</key>
                <array>
                  <dict>
                    <key>UISceneConfigurationName</key><string>Default Configuration</string>
                    <key>UISceneDelegateClassName</key><string>SceneDelegate</string>
                  </dict>
                </array>
              </dict>
            </dict>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict></plist>
          PLIST
          plutil -lint HelloSim.app/Info.plist
          codesign --force --sign - --timestamp=none HelloSim.app 2> out/codesign.err || true
          codesign -dv HelloSim.app > out/codesign.txt 2>&1 || true

          mkdir -p GraphicsApp.app
          cp GraphicsApp_arm64 GraphicsApp.app/GraphicsApp
          cp demo/Assets/badge.png GraphicsApp.app/badge.png
          sed -e 's/HelloSim/GraphicsApp/g' -e 's/com\.iosim\.graphicsapp/com.iosim.graphicsapp/g' \
            -e 's/com\.iosim\.hellosim/com.iosim.graphicsapp/g' \
            HelloSim.app/Info.plist > GraphicsApp.app/Info.plist
          plutil -lint GraphicsApp.app/Info.plist
          codesign --force --sign - --timestamp=none GraphicsApp.app 2> out/codesign-graphics.err || true

          mkdir -p ListApp.app
          cp ListApp_arm64 ListApp.app/ListApp
          sed -e 's/HelloSim/ListApp/g' \
              -e 's/com\.iosim\.hellosim/com.iosim.listapp/g' \
            HelloSim.app/Info.plist > ListApp.app/Info.plist
          plutil -lint ListApp.app/Info.plist
          codesign --force --sign - --timestamp=none ListApp.app 2> out/codesign-list.err || true

      - name: Boot simulator, install and launch the app
        run: |
          set +e
          run_timeout() { python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:], timeout=float(sys.argv[1])).returncode)' "$@"; }
          xcrun simctl list devices available -j > out/devices.json
          UDID=$(python3 - <<'PY'
          import json
          d = json.load(open('out/devices.json'))['devices']
          best = None
          for rt, devs in d.items():
              if '.iOS-' not in rt:
                  continue
              for dev in devs:
                  if not dev.get('isAvailable', True):
                      continue
                  name = dev['name']
                  if not name.startswith('iPhone'):
                      continue
                  pref = 2 if name == 'iPhone 18 Pro' else (0 if 'Duo' in name else 1)
                  score = (pref, rt)
                  if best is None or score > best[0]:
                      best = (score, dev['udid'], name, rt)
          if best:
              print(best[1])
          PY
          )
          echo "UDID=$UDID" > out/boot.txt
          if [ -n "$UDID" ]; then
            xcrun simctl help status_bar > out/status-bar-help.txt 2>&1
            xcrun simctl boot "$UDID" >> out/boot.txt 2>&1
            run_timeout 300 xcrun simctl bootstatus "$UDID" -b >> out/boot.txt 2>&1
            run_timeout 30 xcrun simctl io "$UDID" screenshot out/springboard-real.png >> out/boot.txt 2>&1 || echo "springboard screenshot timed out" >> out/boot.txt
            xcrun simctl install "$UDID" HelloSim.app >> out/boot.txt 2>&1
            ( xcrun simctl launch --console-pty "$UDID" com.iosim.hellosim \
                > out/console.txt 2>&1 & echo $! > /tmp/console.pid )
            sleep 7
            run_timeout 30 xcrun simctl io "$UDID" screenshot out/real-sim.png >> out/boot.txt 2>&1 || echo "hello screenshot timed out" >> out/boot.txt
            if [ ! -s out/real-sim.png ]; then
              xcrun simctl io "$UDID" screenshot --display=1 out/real-sim.png >> out/boot.txt 2>&1
            fi
            kill "$(cat /tmp/console.pid)" 2>/dev/null || true
            xcrun simctl spawn "$UDID" ps aux > out/ps.txt 2>&1
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              --predicate 'process == "HelloSim" OR eventMessage CONTAINS "HelloSim"' \
              > out/app-log.txt 2>&1
            xcrun simctl terminate "$UDID" com.iosim.hellosim >> out/boot.txt 2>&1
            xcrun simctl install "$UDID" GraphicsApp.app >> out/boot.txt 2>&1
            ( xcrun simctl launch --console-pty "$UDID" com.iosim.graphicsapp \
                > out/graphics-console.txt 2>&1 & echo $! > /tmp/gconsole.pid )
            sleep 6
            run_timeout 30 xcrun simctl io "$UDID" screenshot out/graphics-real.png >> out/boot.txt 2>&1 || echo "graphics screenshot timed out" >> out/boot.txt
            kill "$(cat /tmp/gconsole.pid)" 2>/dev/null || true
            xcrun simctl terminate "$UDID" com.iosim.graphicsapp >> out/boot.txt 2>&1
            xcrun simctl install "$UDID" ListApp.app >> out/boot.txt 2>&1
            ( xcrun simctl launch --console-pty "$UDID" com.iosim.listapp \
                > out/list-console.txt 2>&1 & echo $! > /tmp/lconsole.pid )
            sleep 6
            run_timeout 30 xcrun simctl io "$UDID" screenshot out/listapp-real.png >> out/boot.txt 2>&1 || echo "list screenshot timed out" >> out/boot.txt
            kill "$(cat /tmp/lconsole.pid)" 2>/dev/null || true
            xcrun simctl terminate "$UDID" com.iosim.listapp >> out/boot.txt 2>&1
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 \
              -iname 'HelloSim*' -mmin -15 -print -exec cp {} out/ \; \
              > out/crash-reports.txt 2>&1 || true
            xcrun simctl shutdown "$UDID" >> out/boot.txt 2>&1
          fi
          tail -30 out/boot.txt
          cat out/console.txt

      - name: Collect the iOS runtime fonts
        run: |
          set +e
          xcrun simctl runtime list -j > out/runtime-list.json
          RT=$(python3 - <<'PY'
          import json
          d = json.load(open('out/runtime-list.json'))
          cands = []
          for v in d.values():
              if v.get('platformIdentifier') == 'com.apple.platform.iphonesimulator' and v.get('state') == 'Ready':
                  cands.append(v)
          cands.sort(key=lambda v: v.get('version', ''))
          print(cands[-1]['runtimeBundlePath'] if cands else '')
          PY
          )
          echo "$RT" > out/runtime-path.txt
          RTROOT="$RT/Contents/Resources/RuntimeRoot"
          echo "$RTROOT" > out/runtime-root.txt
          find "$RTROOT/System/Library/Fonts" -type f -exec ls -l {} \; > out/font-list.txt 2>&1
          cat out/font-list.txt
          tar czf artifact/ios-fonts.tgz -C "$RTROOT/System/Library/Fonts" . 2> out/fonts-tar.err
          du -sh artifact/ios-fonts.tgz

      - name: Collect artifacts
        run: |
          set +e
          tar czf artifact/HelloSim.app.tgz HelloSim.app
          cp HelloSim_arm64 HelloSim_x86_64 services_test_x86_64 artifact/
          cp GraphicsApp_arm64 GraphicsApp_x86_64 artifact/
          tar czf artifact/GraphicsApp.app.tgz GraphicsApp.app
          cp out/graphics-real.png artifact/ 2>/dev/null
          cp ListApp_arm64 ListApp_x86_64 artifact/
          tar czf artifact/ListApp.app.tgz ListApp.app
          cp out/listapp-real.png artifact/ 2>/dev/null
          cp out/springboard-real.png artifact/ 2>/dev/null
          cp out/real-sim.png artifact/ 2>/dev/null
          cp -R out artifact/out
          tar czf same-app.tgz -C artifact .
          du -sh same-app.tgz
          ls -la artifact

      - uses: actions/upload-artifact@v4
        with:
          name: same-app
          path: same-app.tgz
          retention-days: 7
